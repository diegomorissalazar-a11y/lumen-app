<!-- ══════ MODAL: JSON BIBLIOGRÁFICO ══════ -->
<div id="modal-bib-json" class="modal-overlay" style="z-index:260;">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-header">
      <div class="modal-title">📚 Datos bibliográficos</div>
      <button class="btn-icon" onclick="closeModal('modal-bib-json')"><svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
    </div>
    <div class="modal-body">
      <input type="hidden" id="bib-json-target">
      <p style="font-size:11px;color:var(--ink3);line-height:1.55;margin-bottom:10px;">Pega un JSON <strong>lumen_bibliografia_import_v1</strong>. También se acepta el formato bibliográfico anterior. LUMEN compara los datos con la ficha y no sobrescribe nada sin mostrarte los cambios.</p>
      <textarea id="bib-json-text" class="input" rows="13" spellcheck="false" placeholder='{"schema":"lumen_bibliografia_import_v1","libro":{"titulo":"...","autor":"...","editorial":"...","isbn":"...","edicion":{"numero":"3","descripcion":"Tercera edición","anio":2016,"mes":"octubre"},"ciudad_publicacion":"Madrid","traductores":["..."],"anio_obra_original":1885,"anio_obra_original_fin":1886}}'></textarea>
      <button class="btn btn-secondary" onclick="previewBibliographicJson()" style="width:100%;margin-top:8px;">Revisar JSON</button>
      <div id="bib-json-preview" style="display:none;margin-top:10px;border:1px solid var(--border);border-radius:6px;overflow:hidden;background:#fff;"></div>
      <div style="display:flex;gap:8px;margin-top:10px;">
        <button id="bib-json-apply" class="btn btn-primary" onclick="applyBibliographicJson()" style="display:none;flex:1;">✓ Aplicar cambios</button>
        <button class="btn btn-secondary" onclick="closeModal('modal-bib-json')" style="flex:1;">Cancelar</button>
      </div>
    </div>
  </div>
</div>
