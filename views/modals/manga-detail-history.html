<!-- ══════ MODAL: PROGRESO MANGA ══════ -->
<div id="modal-manga-progress" class="modal-overlay"><div class="modal"><div class="modal-handle"></div><div class="modal-header"><div class="modal-title" id="manga-progress-title">Actualizar manga</div><button class="btn-icon" onclick="closeModal('modal-manga-progress')">✕</button></div><div class="modal-body"><input type="hidden" id="manga-progress-id"><div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;"><div class="field"><label>Capítulo actual</label><input class="input" type="number" id="manga-progress-current" min="0" oninput="updateMangaProgressPreview()"></div><div class="field"><label>Capítulos totales</label><input class="input" type="number" id="manga-progress-total" min="0" oninput="updateMangaProgressPreview()"></div></div><div class="progress-wrap" style="height:8px;margin-bottom:5px;"><div class="progress-fill" id="manga-progress-bar" style="width:0%;background:#6b3a8a;"></div></div><div id="manga-progress-label" style="font-size:12px;color:var(--ink3);margin-bottom:16px;"></div><div class="field"><label>Estado de publicación</label><select class="input" id="manga-progress-publication"><option value="en_emision">En emisión</option><option value="en_pausa">En pausa</option><option value="finalizado">Finalizado</option></select></div><button class="btn btn-primary" onclick="saveMangaProgress()" style="margin-bottom:8px;">Guardar progreso</button><button class="btn btn-secondary" onclick="finishManga()">✓ Terminé</button></div></div></div>

<!-- ══════ MODAL: DETALLE ══════ -->
<!-- ══════ MODAL: HISTORIA RÁPIDA ══════ -->
<div id="modal-historia-quick" class="modal-overlay"><div class="modal"><div class="modal-handle"></div><div class="modal-header"><div><div class="modal-title">🏛 Historia</div><div id="histq-book" style="font-size:11px;color:var(--ink4);margin-top:3px;"></div></div><button class="btn-icon" onclick="closeModal('modal-historia-quick')">✕</button></div><div class="modal-body"><input type="hidden" id="histq-entry-id"><div class="field"><label>Línea histórica</label><input class="input" id="histq-linea" list="histq-lineas-catalogo" placeholder="Selecciona o escribe una nueva"><datalist id="histq-lineas-catalogo"></datalist></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;"><div class="field"><label>Fecha inicial</label><input class="input" type="number" id="histq-inicio" placeholder="-480"></div><div class="field"><label>Fecha final</label><input class="input" type="number" id="histq-fin" placeholder="-479"></div></div><div class="field"><label>Conecta con otras líneas históricas</label><div id="histq-related-lines" style="display:flex;flex-wrap:wrap;gap:6px;"></div><div style="font-size:10px;color:var(--ink4);margin-top:5px;line-height:1.4;">Opcional. Este libro queda como evidencia de la conexión entre líneas.</div></div><button class="btn btn-primary" onclick="saveHistoriaQuick()">Guardar Historia</button></div></div></div>

<div id="modal-detail" class="modal-overlay">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-header">
      <div class="modal-title" id="detail-title">—</div>
      <button class="btn-icon" onclick="closeModal('modal-detail')"><svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
    </div>
    <div class="modal-body" id="detail-body"></div>
  </div>
</div>
