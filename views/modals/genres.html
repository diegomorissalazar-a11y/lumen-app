      <div class="modal-title" id="genero-quick-title">Etiquetar libro</div>
      <button class="btn-icon" onclick="closeModal('modal-genero-quick')"><svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
    </div>
    <div class="modal-body">
      <input type="hidden" id="genero-quick-id">
      <div style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px;" id="genero-quick-chips"></div>
      <button class="btn btn-primary" onclick="saveGeneroQuick()">Guardar etiquetas</button>
    </div>
  </div>
</div>
